name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: leadra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/leadra_test
      # schema.prisma declares directUrl, and Prisma will not load its config
      # without it. CI talks to Postgres directly, so both point at the same place.
      DIRECT_URL: postgresql://test:test@localhost:5432/leadra_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/leadra_test
      TOKEN_ENCRYPTION_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfZm9yX2NpX29ubHkhIQ==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run lint
      # Reports advisories in shipped dependencies. Not blocking yet: Next 14.2
      # has no patched release and closing its advisories needs a major upgrade
      # (tracked separately). A gate that is red on day one gets ignored, so
      # this flips to blocking the moment that upgrade lands.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm test # unit + isolation (DB available) — merge blocked on failure
      - run: npx next build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: leadra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/leadra_test
      DIRECT_URL: postgresql://test:test@localhost:5432/leadra_test
      TOKEN_ENCRYPTION_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfZm9yX2NpX29ubHkhIQ==
      CRON_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed # E2E asserts against the demo org
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The Worker is a different runtime, not a different host: no filesystem, a
  # different module-resolution condition, sockets owned by the request that
  # opened them. A green Node build says nothing about any of that — the tree
  # once shipped a database layer that passed every unit test and could not
  # run a single query under the real bundler. So this job builds the Worker
  # and then serves real requests from workerd against a real Postgres.
  workers:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: leadra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/leadra_test
      DIRECT_URL: postgresql://test:test@localhost:5432/leadra_test
      TOKEN_ENCRYPTION_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfZm9yX2NpX29ubHkhIQ==
      CRON_SECRET: ci-only-secret
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm } # wrangler requires Node 22
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx opennextjs-cloudflare build
      - name: Serve from workerd and exercise the database path
        run: |
          printf 'DATABASE_URL=%s\nTOKEN_ENCRYPTION_KEY=%s\nCRON_SECRET=%s\n' \
            "$DATABASE_URL" "$TOKEN_ENCRYPTION_KEY" "$CRON_SECRET" > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8787/login && break
            sleep 2
          done
          node scripts/workers-smoke.mjs http://127.0.0.1:8787
      - name: Worker log
        if: always()
        run: tail -n 150 wrangler.log || true
