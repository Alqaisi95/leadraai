name: Baseline migration

# Run once from Actions → "Baseline migration" → Run workflow.
# Generates prisma/migrations/0_init from schema.prisma and opens a PR.
# After merging, mark it as already applied on the existing production
# database (its tables already exist) — see docs/DEPLOY-CLOUDFLARE.md §6.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Generate 0_init from schema
        run: |
          if [ -d prisma/migrations ]; then
            echo "prisma/migrations already exists — nothing to do"; exit 1
          fi
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/0_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          wc -l prisma/migrations/0_init/migration.sql

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/baseline-migration
          git add prisma/migrations
          git commit -m "Add baseline migration 0_init generated from schema.prisma"
          git push -u origin chore/baseline-migration
          gh pr create --base main --head chore/baseline-migration \
            --title "Baseline migration (0_init)" \
            --body "Generated by the Baseline migration workflow. After merging, run once against production: \`npx prisma migrate resolve --applied 0_init\`."
